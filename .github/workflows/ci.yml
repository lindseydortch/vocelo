name: CI

# Required status checks for PRs into dev and main: typecheck, lint, test, build, e2e.
# typecheck / lint / test run in parallel, then build, then e2e.
# No repository secrets: providers are fixtures, Buffer and Stripe are mocked,
# and the database is embedded-postgres.

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TTS_PROVIDER: fixture
      LLM_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest starts a throwaway embedded Postgres in its global setup.
      - run: npm run test:coverage

  build:
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values so src/server/env.ts validates; nothing here is a secret.
      APP_URL: https://localhost:3000
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-session-secret-not-a-secret
      TOKEN_ENCRYPTION_KEY: ci-token-key-not-a-secret
      BUFFER_CLIENT_ID: ci-buffer-client-id
      BUFFER_CLIENT_SECRET: ci-buffer-client-secret
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_CREATOR_PRICE_ID: price_ci
      TTS_PROVIDER: fixture
      LLM_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
